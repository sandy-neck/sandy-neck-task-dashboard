name: Daily Analytics Report

on:
  schedule:
    # 7 AM ET = 12:00 UTC (EST, Nov–Mar) / 11:00 UTC (EDT, Mar–Nov)
    # Using 12:00 UTC ensures delivery by 7 AM ET year-round (7 AM EST / 8 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip email send)'
        type: boolean
        default: false

jobs:
  daily-analytics:
    name: Run Daily Analytics Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The agent writes its journal back into brain/, so the run needs push access.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed so the journal commit can rebase onto any concurrent pushes.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent_requirements.txt

      - name: Install dependencies
        run: pip install -r agent_requirements.txt

      - name: Run analytics agent
        working-directory: agent
        env:
          # Shopify — required
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}

          # Claude / Anthropic — required
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Email delivery — required
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Pinned deliberately rather than read from a secret: the secret's value can't be read
          # back once set, so it was impossible to confirm where the report was actually going.
          REPORT_RECIPIENT: goodvibes@sandyneckprovisions.com
          REPORT_SENDER_NAME: Sandy Neck Analytics

          # Klaviyo — optional (stub if missing)
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          KLAVIYO_STUB_MODE: ${{ secrets.KLAVIYO_PRIVATE_KEY == '' && 'true' || 'false' }}

          # Social media — optional (stub if missing)
          SOCIAL_STUB_MODE: ${{ secrets.INSTAGRAM_ACCESS_TOKEN == '' && 'true' || 'false' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

          # Google Business Profile + Search Console — optional (stub if missing)
          GOOGLE_STUB_MODE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON == '' && 'true' || 'false' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_BUSINESS_LOCATION: ${{ secrets.GOOGLE_BUSINESS_LOCATION }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}

          # Weather & tides — Open-Meteo needs no key. Tides stay off until a NOAA station
          # is set; find the nearest at https://tidesandcurrents.noaa.gov/map/
          STORE_LATITUDE: ${{ vars.STORE_LATITUDE || '41.7370' }}
          STORE_LONGITUDE: ${{ vars.STORE_LONGITUDE || '-70.3870' }}
          # Station resolves by name against NOAA's list at runtime; set NOAA_TIDE_STATION to
          # pin a specific id instead.
          NOAA_TIDE_STATION: ${{ vars.NOAA_TIDE_STATION }}
          NOAA_TIDE_STATION_NAME: ${{ vars.NOAA_TIDE_STATION_NAME || 'Barnstable Harbor' }}

          ANALYTICS_MODEL: ${{ vars.ANALYTICS_MODEL || 'claude-opus-5' }}

        run: python daily_analytics.py

      - name: Commit journal entry
        # Runs even if the email failed — a day's analysis is worth keeping either way.
        if: always()
        run: |
          if [ -z "$(git status --porcelain brain/)" ]; then
            echo "No brain changes to commit."
            exit 0
          fi
          git config user.name  "Sandy Neck Analytics"
          git config user.email "actions@github.com"
          git add brain/
          git commit -m "Daily journal: $(date -u +%Y-%m-%d)"
          # The scheduled run and a human push can race; rebase rather than fail.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep $((attempt * 3))
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-failure-log
          path: agent/
          retention-days: 7
